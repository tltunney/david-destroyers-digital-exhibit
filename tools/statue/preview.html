<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Statue Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2622; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../lib/three/build/three.module.js", "three/addons/": "../../lib/three/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- Preview of assets/models/copperfield.glb. Add #angle=0.6&zoom=1&y=0.95 to the URL to turn the view,
       &cy=0.6 to set the camera height, &ao=0 to hide the baked occlusion, and &model=path/to/other.glb to look at a different file. -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MeshoptDecoder } from '../../lib/three/examples/jsm/libs/meshopt_decoder.module.js';

    const params = new URLSearchParams(location.hash.slice(1));
    const angle = Number(params.get('angle') ?? 0.35);
    const zoom = Number(params.get('zoom') ?? 1);
    const focusY = Number(params.get('y') ?? 0.95);
    const eyeY = Number(params.get('cy') ?? focusY + 0.15); // camera height

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a2a26);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.5;
    const key = new THREE.SpotLight(0xfff3e2, 40, 20, 0.5, 0.6, 1);
    key.position.set(1.2, 4, 3);
    key.castShadow = true;
    scene.add(key, new THREE.HemisphereLight(0xfff6ea, 0x4a3f35, 0.5));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x8a7f72 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
    const dist = 4.2 / zoom;
    camera.position.set(Math.sin(angle) * dist, eyeY, Math.cos(angle) * dist);
    camera.lookAt(0, focusY, 0);

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder); // the statue's buffers use EXT_meshopt_compression
    loader.load(params.get('model') ?? '../../assets/models/copperfield.glb', (gltf) => {
      gltf.scene.traverse((m) => {
        if (m.isMesh) {
          m.castShadow = m.receiveShadow = true;
          // COLOR_0 holds ambient occlusion baked from the distance field (&ao=0 to switch it off)
          const ao = !!m.geometry.attributes.color && params.get('ao') !== '0';
          m.material = new THREE.MeshStandardMaterial({ color: 0xefebe4, roughness: 0.35, vertexColors: ao });
        }
      });
      scene.add(gltf.scene);
      renderer.render(scene, camera);
      window.ready = true;
    });
  </script>
</body>
</html>
